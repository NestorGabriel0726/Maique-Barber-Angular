<header [class.header-escondido]="isHeaderEscondido">
  <nav>
    <div class="logo">
      <a href="#home" (click)="fecharMenu()">
        <img src="imgs/logo preta.png" alt="Maique Barber Logo">
      </a>
    </div>

    <button class="menu-toggle" aria-label="Abrir Menu" (click)="toggleMenu()">
      <i class="fa-solid" [class.fa-bars]="!isMenuAberto" [class.fa-xmark]="isMenuAberto"></i>
    </button>

    <ul class="nav-links" [class.active]="isMenuAberto">
      <li><a href="#home" (click)="fecharMenu()">HOME</a></li>
      <li><a href="#servicos" (click)="fecharMenu()">SERVIÇOS</a></li>
      <li><a href="#sobre" (click)="fecharMenu()">SOBRE NÓS</a></li>
      <li><a href="#galeria" (click)="fecharMenu()">GALERIA</a></li>
      <li><a href="#depoimentos" (click)="fecharMenu()">DEPOIMENTOS</a></li>
      <li><a href="#contato" (click)="fecharMenu()">CONTATO</a></li>
      
      <!-- Botão Dinâmico de Login / Agendamento -->
      <li>
        <button 
          [class]="estaLogado() ? 'nav-btn-agendar' : 'nav-btn-login'" 
          [routerLink]="estaLogado() ? '/agendamento' : '/login'"
          (click)="fecharMenu()">
          
          <ng-container *ngIf="!estaLogado()">
            <i class="fa-solid fa-right-to-bracket"></i> Entrar / Cadastrar
          </ng-container>

          <ng-container *ngIf="estaLogado()">
            <i class="fa-regular fa-calendar-check"></i> Agendar Agora
          </ng-container>
        </button>
      </li>

      <!-- Botão de Logout (Aparece apenas quando logado) -->
      <li *ngIf="estaLogado()">
        <button class="nav-btn-logout" (click)="logout()">
          <i class="fa-solid fa-right-from-bracket"></i> Sair
        </button>
      </li>

      <li>
        <button class="btn-theme-toggle" (click)="toggleTheme()" aria-label="Alternar tema">
          <i class="fa-solid" [ngClass]="isLightMode ? 'fa-sun' : 'fa-moon'"></i>
        </button>
      </li>
    </ul>
  </nav>
</header>
